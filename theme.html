<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB UI Kit Theme Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            color: #343a40;
        }
        .navbar-brand {
            color: #0056d2;
            font-weight: 600;
        }
        .hero {
            padding: 60px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .hero p {
            color: #6c757d;
            margin: 20px 0;
        }
        .btn-primary {
            background-color: #0056d2;
            border-color: #0056d2;
        }
        .btn-light {
            background-color: #f1f4ff;
            color: #0056d2;
        }
        .hero-img {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="#">SB UI Kit Pro</a>
            <div class="d-flex">
                <a href="#" class="btn btn-danger">Buy Now</a>
            </div>
        </div>
    </nav>

    <section class="hero container">
        <div class="col-md-6">
            <h1>Build your next project faster with SB UI Kit Pro</h1>
            <p>Welcome to SB UI Kit Pro, a toolkit for building beautiful web interfaces,<br>created by the development team at Start Bootstrap.</p>
            <div>
                <a href="#" class="btn btn-primary me-2">View Demo</a>
                <a href="#" class="btn btn-light">Documentation</a>
            </div>
        </div>
        <div class="col-md-6 text-center">
            <img src="/mnt/data/c8e7abb0-6f5d-46c2-b811-92a22f0ec6b0.png" alt="Hero Image" class="hero-img">
        </div>
    </section>

</body>
</html>
